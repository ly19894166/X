[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "x-event-contracts"
version = "0.1.0"
description = "X 独立事件引擎：Phase 1 契约与 Phase 2 SQLite 底座"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic==2.12.5", "SQLAlchemy==2.0.43", "httpx==0.28.1", "tenacity==9.1.2", "feedparser==6.0.12"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
x-event = "xevent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["pit: 时间可知性与模式隔离契约"]
