name: Event Engine Phase 1

on:
  pull_request:
    paths:
      - 'subsystems/event_engine/**'
      - '.github/workflows/event-engine-ci.yml'
permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: subsystems/event_engine
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: 安装已锁版本与哈希的独立依赖
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: 安装 Event Engine 包
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: 依赖一致性
        run: python -m pip check
      - name: Phase 1 focused tests
        run: python -m pytest -q
      - name: PIT tests 单独报告
        run: python -m pytest -q -m pit
      - name: 中文离线 fixture
        run: x-event ingest --fixture configs/offline_fixture.zh-CN.json
