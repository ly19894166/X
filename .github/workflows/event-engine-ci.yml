name: Event Engine Phase 10

on:
  pull_request:
    paths:
      - 'subsystems/event_engine/**'
      - '.github/workflows/event-engine-ci.yml'
permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: subsystems/event_engine
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: 安装已锁构建工具
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock'
      - name: 安装已锁版本与哈希的独立依赖
        run: 'python -m pip install --require-hashes --no-build-isolation --only-binary=:all: --no-binary=sgmllib3k -r requirements.lock'
      - name: 安装 Event Engine 包
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: 依赖一致性
        run: python -m pip check
      - name: Phase 1–10 full tests
        run: python -m pytest -q
      - name: PIT tests 单独报告
        run: python -m pytest -q -m pit
      - name: 中文离线 fixture
        run: x-event ingest --fixture configs/offline_fixture.zh-CN.json
      - name: Phase 2 持久化 fixture
        run: x-event ledger-ingest --db phase2-ci.sqlite --fixture configs/phase2_observations.zh-CN.json
      - name: Phase 2 Replay
        run: x-event ledger-replay --db phase2-ci.sqlite --as-of 2099-01-01T00:00:00Z
      - name: Phase 3 三维状态中文fixture与PIT回放
        run: x-event state-fixture --db phase3-ci.sqlite --fixture configs/phase3_states.zh-CN.json
      - name: Phase 4 影响变量与产业本体中文fixture
        run: x-event ontology-fixture --db phase4-ci.sqlite --fixture configs/phase4_ontology.zh-CN.json
      - name: Phase 5 公司证券与披露覆盖中文fixture
        run: x-event exposure-fixture --db phase5-ci.sqlite --fixture configs/phase5_exposures.zh-CN.json
      - name: Phase 6 正负经济传导中文工程fixture
        run: python -m xevent.graph.fixture --db phase6-ci.sqlite
      - name: Phase 7 固定研究与独立反方中文Mock fixture
        run: python -m xevent.research.fixture --db phase7-ci.sqlite
      - name: Phase 8 市场定价状态中文离线fixture
        run: python -m xevent.pricing.fixture --db phase8-ci.sqlite
      - name: Phase 9 独立分榜与全样本中文离线fixture
        run: python -m xevent.ranking.fixture --db phase9-ci.sqlite
      - name: Phase 10 Shadow结算与全样本中文离线fixture
        run: python -m xevent.evaluation.fixture --db phase10-labels-ci.sqlite --features-db phase10-features-ci.sqlite
